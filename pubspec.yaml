name: smart_planter_app
description: "Smart planter monitoring, plant profiles, and care advice."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  # Flutter's platform-adaptive controls reference this icon font.
  cupertino_icons: ^1.0.8
  firebase_database: ^12.1.3
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_markdown: ^0.7.3
  http: ^1.6.0

  firebase_messaging: ^16.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/login.jpg
    - assets/logo.png
    - assets/dashboard.png
    - assets/sproutlogo.png
